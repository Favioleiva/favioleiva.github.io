<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.url == '/' %}Favio Leiva — Economics, Geography and Other Arts{% else %}{{ page.title }} — Favio Leiva{% endif %}</title>
    <meta name="description" content="Favio Leiva's personal academic website — Economics, Geography, Photography, Music and Other Arts.">
    <meta property="og:title" content="{% if page.url == '/' %}Favio Leiva — Economics, Geography and Other Arts{% else %}{{ page.title }} — Favio Leiva{% endif %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://favioleiva.github.io{{ page.url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">
    <link rel="shortcut icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJDXQNTL8V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HJDXQNTL8V');
    </script>

    <script src="https://kit.fontawesome.com/66fbeebd3b.js" crossorigin="anonymous"></script>
</head>
<body{% if page.url == '/' %} class="is-home"{% endif %}>
    <div class="home-background" aria-hidden="true">
        <div class="home-background-image"></div>
        <canvas id="home-network-canvas"></canvas>
    </div>
    <header>
        <h1>Economics, Geography &amp; Other Arts</h1>
        <nav>
            <ul>
                <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
                <li><a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} class="active"{% endif %}>Publications</a></li>
                <li><a href="{{ '/presentations/' | relative_url }}"{% if page.url contains '/presentations' %} class="active"{% endif %}>Presentations</a></li>
                <li><a href="{{ '/code/' | relative_url }}"{% if page.url contains '/code' %} class="active"{% endif %}>Code</a></li>
                <li><a href="{{ '/tutorials/' | relative_url }}"{% if page.url contains '/tutorials' %} class="active"{% endif %}>Tutorials</a></li>
                <li><a href="{{ '/essays/' | relative_url }}"{% if page.url contains '/essays' %} class="active"{% endif %}>Essays</a></li>
                <li><a href="{{ '/music/' | relative_url }}"{% if page.url contains '/music' %} class="active"{% endif %}>Music</a></li>
                <li><a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact' %} class="active"{% endif %}>Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {{ content }}
    </main>
    <footer>
        &copy; 2025 Favio Leiva Cárdenas · Nagoya, Japan
    </footer>
    <script src="{{ '/js/hero-network.js' | relative_url }}" defer></script>
</body>
</html>
